spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  data:
    redis:
      host: localhost
      port: 6379

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.training.entity
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RpbmctcHVycG9zZXMtb25seS0yMDI0
  access-token-expiration: 86400000
  refresh-token-expiration: 604800000
  cert-verify-expiration-days: 30

file:
  storage:
    base-path: ./test-uploads

pagehelper:
  helper-dialect: h2
  reasonable: true
